# 智能快寄柜后端本地配置模板（config.example.yaml）
# 使用方法：复制本文件为同目录下的 config.yaml，并把所有 <...> 占位符替换为本机实际值。
# 生产环境请通过部署密管/环境变量覆盖，切勿把真实密码、密钥提交到仓库。

server:
  addr: ":18080"
  mode: "debug"          # debug / release

database:
  # DSN 格式：<DB_USER>:<DB_PASSWORD>@tcp(<DB_HOST>:<DB_PORT>)/<DB_NAME>?charset=utf8mb4&parseTime=True&loc=Local
  # 示例：root:mypassword@tcp(127.0.0.1:3306)/smart_lockers?charset=utf8mb4&parseTime=True&loc=Local
  dsn: "<DB_USER>:<DB_PASSWORD>@tcp(<DB_HOST>:<DB_PORT>)/<DB_NAME>?charset=utf8mb4&parseTime=True&loc=Local"
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime_sec: 3600

redis:
  addr: "<REDIS_HOST>:<REDIS_PORT>"   # 示例：127.0.0.1:6379
  password: "<REDIS_PASSWORD>"        # 本地无密码时留空字符串 ""
  db: 0

jwt:
  secret: "<JWT_SECRET>"              # 请自行生成高强度随机串，如：openssl rand -hex 32
  expire_hours: 24

# 通知渠道开关与频控（工单01）
notify:
  dedupe_window_sec: 60
  max_retry: 3
  channels:
    inapp: true
    sms: false
    email: false
    callback: false

# 收费规则基础配置（工单04，实际以数据表为准）
billing:
  currency: "CNY"

# 支付宝支付配置（工单02）。敏感字段只允许写入被 .gitignore 排除的 config.yaml，禁止提交仓库。
# 沙箱网关由 SDK 自动选择官方地址 https://openapi-sandbox.dl.alipaydev.com/gateway.do
alipay:
  app_id: "<ALIPAY_APP_ID>"
  private_key: "<APP_PRIVATE_KEY_PKCS1_OR_PKCS8_BASE64>"
  public_key: "<ALIPAY_PUBLIC_KEY_PKIX_BASE64>"
  notify_url: "https://<YOUR_DOMAIN>/api/v1/pay/alipay/notify"
  return_url: ""
  sandbox: true

