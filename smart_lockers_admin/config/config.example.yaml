# B端管理后台配置模板（config.example.yaml）
# 使用：复制为同目录 config.yaml，将 <...> 占位符替换为本机实际值。
# 禁止把真实密码、密钥提交仓库；生产用密管/环境变量覆盖。

server:
  addr: ":18081"          # B端后端端口，避开主站 :18080
  mode: "debug"           # debug / release

jwt:
  secret: "<JWT_SECRET>"  # 请自行生成：openssl rand -hex 32
  expire_hours: 24

# B端演示账号（仅占位示例，非真实凭据）。真实账号走数据库/密管。
demo_admins:
  - username: "operator"
    password: "<DEMO_PASSWORD>"
    role: "operator"       # 平台运营
    site_id: 0
  - username: "site_admin"
    password: "<DEMO_PASSWORD>"
    role: "site_admin"     # 网点管理员
    site_id: 1001
  - username: "user"
    password: "<DEMO_PASSWORD>"
    role: "user"           # 普通用户
    site_id: 0

# 可配置化：告警级别、对账容差、审计保留条数 @ticket B端-可配置化
policy:
  alarm_levels: "info,warn,critical"
  reconcile_tolerance_fen: 0
  audit_max_records: 500

# GORM 真实数据库对接（默认 enable: false 走内存演示；置 true 后操作真正落库）@ticket B端-真实对接
# 使用：复制本文件为 config.yaml，填好 dsn 并将 enable 置 true。禁止把真实密码提交仓库。
db:
  enable: false
  dsn: "root:<PASSWORD>@tcp(127.0.0.1:13307)/smart_lockers?charset=utf8mb4&parseTime=True&loc=Local"
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime_sec: 3600

# MQTT�豸�������ã�B��-IoT��̨����enabled=true ʱֱ�� EMQX �·� platform/# ָ����Ļ�ִ
mqtt:
  enabled: false
  broker: "tcp://<MQTT_HOST>:1883"
  client_id: "smart-lockers-admin"
  username: "backend-service"
  password: "<MQTT_PASSWORD>"